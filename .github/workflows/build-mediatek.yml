name: Build Kernel (MediaTek Clean)

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: "Kernel source repo URL"
        required: true
        type: string

      KERNEL_BRANCH:
        description: "Kernel source branch"
        required: true
        type: string

      KERNEL_CONFIG:
        description: "Defconfig name"
        required: true
        type: string

      KERNEL_VERSION:
        description: "Kernel version"
        required: true
        type: choice
        options:
          - "4.4"
          - "4.14"
          - "4.19"

      CODENAME:
        description: "Device codename"
        required: true
        type: string

      PATCH_KERNELSU:
        description: "KernelSU"
        required: false
        type: choice
        options:
          - "none"
          - "ksu-next"
          - "ksu-original"
        default: "none"


jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      KERNEL_SOURCE: ${{ github.event.inputs.KERNEL_SOURCE }}
      KERNEL_BRANCH: ${{ github.event.inputs.KERNEL_BRANCH }}
      KERNEL_CONFIG: ${{ github.event.inputs.KERNEL_CONFIG }}
      KERNEL_VERSION: ${{ github.event.inputs.KERNEL_VERSION }}
      CODENAME: ${{ github.event.inputs.CODENAME }}
      PATCH_KERNELSU: ${{ github.event.inputs.PATCH_KERNELSU }}

      KBUILD_BUILD_USER: github-actions
      KBUILD_BUILD_HOST: github


    steps:

      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            git \
            curl \
            wget \
            zip \
            unzip \
            python3 \
            ccache \
            libncurses-dev \
            device-tree-compiler


      - name: Clone kernel source
        run: |
          git clone \
            --depth=1 \
            --recurse-submodules \
            -b "$KERNEL_BRANCH" \
            "$KERNEL_SOURCE" \
            kernel


      - name: Setup toolchain
        run: |

          mkdir -p toolchain


          case "$KERNEL_VERSION" in

            4.4)
              CLANG_BRANCH="9.0.0-release"
              ;;

            4.14)
              CLANG_BRANCH="12.0.0-release"
              ;;

            4.19)
              CLANG_BRANCH="14.0.0-release"
              ;;

          esac


          echo "Using clang: $CLANG_BRANCH"


          git clone \
            --depth=1 \
            -b "$CLANG_BRANCH" \
            https://github.com/ZyCromerZ/Clang \
            toolchain/clang



          git clone \
            --depth=1 \
            -b android-9.0.0_r1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            toolchain/gcc64


          git clone \
            --depth=1 \
            -b android-9.0.0_r1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            toolchain/gcc32



          echo "$GITHUB_WORKSPACE/toolchain/clang/bin" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/toolchain/gcc64/bin" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/toolchain/gcc32/bin" >> $GITHUB_PATH



      - name: Patch KernelSU
        if: env.PATCH_KERNELSU != 'none'
        working-directory: kernel
        run: |

          if [ "$PATCH_KERNELSU" = "ksu-next" ]; then

            curl -LSs \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            | bash

          else

            curl -LSs \
            https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh \
            | bash

          fi



      - name: Build kernel
        working-directory: kernel
        run: |

          export ARCH=arm64
          export SUBARCH=arm64

          export LLVM=1
          export LLVM_IAS=1


          unset KCFLAGS
          unset CFLAGS
          unset CXXFLAGS



          echo "===== Compiler ====="

          clang --version

          ld.lld --version



          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            "$KERNEL_CONFIG"



          if [ -f scripts/config ]; then

            ./scripts/config \
              --file out/.config \
              -d POLLY_CLANG \
              || true

          fi



          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            -j$(nproc) \
            2>&1 | tee build.log



      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4

        with:

          name: build-log

          path: kernel/build.log
