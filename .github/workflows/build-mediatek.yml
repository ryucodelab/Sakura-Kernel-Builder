name: Build Kernel (MediaTek) - Fixed

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: "Kernel source repo URL"
        required: true
        type: string
      KERNEL_BRANCH:
        description: "Kernel source branch"
        required: true
        type: string
      KERNEL_CONFIG:
        description: "Defconfig name (e.g. lavender_defconfig)"
        required: true
        type: string
      KERNEL_NAME:
        description: "Kernel name for file naming"
        required: false
        type: string
        default: "Sakura"
      KERNEL_VERSION:
        description: "Major kernel version (determines toolchain)"
        required: true
        type: choice
        options:
          - "4.4"
          - "4.14"
          - "4.19"
      CODENAME:
        description: "Device codename (e.g. merlinx)"
        required: true
        type: string
      BOT_TOKEN:
        description: "Telegram Bot Token (optional)"
        required: false
        type: string
        default: ""
      CHAT_ID:
        description: "Telegram Chat ID (optional)"
        required: false
        type: string
        default: ""
      USE_ANYKERNEL3:
        description: "Use AnyKernel3?"
        required: true
        type: choice
        options:
          - "yes"
          - "no"
        default: "yes"
      PATCH_KERNELSU:
        description: "Patch KernelSU"
        required: false
        type: choice
        options:
          - "none"
          - "ksu-next"
          - "ksu-original"
        default: "none"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      KERNEL_SOURCE: ${{ github.event.inputs.KERNEL_SOURCE }}
      KERNEL_BRANCH: ${{ github.event.inputs.KERNEL_BRANCH }}
      KERNEL_CONFIG: ${{ github.event.inputs.KERNEL_CONFIG }}
      KERNEL_NAME: ${{ github.event.inputs.KERNEL_NAME }}
      KERNEL_VERSION: ${{ github.event.inputs.KERNEL_VERSION }}
      CODENAME: ${{ github.event.inputs.CODENAME }}
      BOT_TOKEN: ${{ github.event.inputs.BOT_TOKEN }}
      CHAT_ID: ${{ github.event.inputs.CHAT_ID }}
      USE_ANYKERNEL3: ${{ github.event.inputs.USE_ANYKERNEL3 }}
      PATCH_KERNELSU: ${{ github.event.inputs.PATCH_KERNELSU }}
      KBUILD_BUILD_USER: "github-actions"
      KBUILD_BUILD_HOST: "ci"

    steps:
      - name: ⏱️ Record start time
        run: echo "START_EPOCH=$(date +%s)" >> $GITHUB_ENV

      - name: 📣 Telegram start
        if: env.BOT_TOKEN != '' && env.CHAT_ID != ''
        run: |
          KSU_LABEL="No"
          [ "$PATCH_KERNELSU" = "ksu-next" ] && KSU_LABEL="Yes (KSU-Next)"
          [ "$PATCH_KERNELSU" = "ksu-original" ] && KSU_LABEL="Yes (KSU Original)"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG=$'🔨 *Build Started*\nKernel: `'"${KERNEL_NAME}"'`\nDevice: `'"${CODENAME}"'`\nKernel version: `'"${KERNEL_VERSION}"'`\nKernelSU: `'"${KSU_LABEL}"'`\nTriggered by: `${{ github.actor }}`'
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d parse_mode="Markdown" \
            --data-urlencode text="${MSG}" \
            --data-urlencode reply_markup="$(jq -n --arg url "$RUN_URL" \
              '{inline_keyboard: [[{text: "🔗 View Build Run", url: $url}]]}')"

      - name: 🧹 Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true

      - name: 📦 Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            git curl wget zip unzip python3 python-is-python3 \
            cpio kmod rsync ccache dwarves libncurses-dev \
            device-tree-compiler
          if [ "$KERNEL_VERSION" = "4.4" ] || [ "$KERNEL_VERSION" = "4.14" ]; then
            wget -q http://archive.ubuntu.com/ubuntu/pool/main/o/openssl1.0/libssl1.0.0_1.0.2n-1ubuntu5.10_amd64.deb || true
            sudo dpkg -i libssl1.0.0_1.0.2n-1ubuntu5.10_amd64.deb 2>/dev/null || true
          fi

      - name: 🗃️ Setup ccache
        run: |
          mkdir -p ~/.ccache
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: 📥 Clone kernel source
        run: |
          git clone --depth=1 --recurse-submodules --shallow-submodules -b "$KERNEL_BRANCH" "$KERNEL_SOURCE" kernel
          cd kernel
          if git submodule status | grep -qE '^-'; then
            echo "Some submodules not initialized, retrying without shallow..."
            git submodule update --init --recursive
          fi
          cd ..
          echo "KDIR=$(pwd)/kernel" >> $GITHUB_ENV
          echo "KERNEL_COMMIT=$(cd kernel && git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: 🛠️ Setup toolchain (Clang + GCC)
        run: |
          mkdir -p toolchain/clang toolchain/gcc64 toolchain/gcc32

          # Default toolchain based on kernel version
          case "$KERNEL_VERSION" in
            "4.4")
              CLANG_REPO="https://github.com/kdrag0n/proton-clang"
              CLANG_BRANCH=""   # default branch
              ;;
            "4.14")
              # Proton Clang 12 – proven stable for 4.14
              CLANG_REPO="https://github.com/kdrag0n/proton-clang"
              CLANG_BRANCH="master"
              ;;
            "4.19")
              CLANG_REPO="https://github.com/ZyCromerZ/Clang"
              CLANG_BRANCH="14.0.0-release"
              ;;
          esac

          # Override for merlin/merlinx – force Proton Clang
          if [ "$CODENAME" = "merlin" ] || [ "$CODENAME" = "merlinx" ]; then
            CLANG_REPO="https://github.com/kdrag0n/proton-clang"
            CLANG_BRANCH="master"
            echo "Merlin/Merlinx detected: forcing Proton Clang 12"
          fi

          echo "Using clang repo: $CLANG_REPO (branch: ${CLANG_BRANCH:-default})"
          CLONE_OK=0
          if [ -n "$CLANG_BRANCH" ]; then
            if git ls-remote --heads "$CLANG_REPO" "$CLANG_BRANCH" | grep -q "$CLANG_BRANCH"; then
              git clone --depth=1 -b "$CLANG_BRANCH" "$CLANG_REPO" toolchain/clang && CLONE_OK=1
            fi
          else
            git clone --depth=1 "$CLANG_REPO" toolchain/clang && CLONE_OK=1
          fi

          if [ "$CLONE_OK" = "0" ]; then
            echo "::warning::Primary clang failed, falling back to Proton Clang default"
            rm -rf toolchain/clang
            git clone --depth=1 https://github.com/kdrag0n/proton-clang toolchain/clang
          fi

          # GCC for non-4.19
          if [ "$KERNEL_VERSION" != "4.19" ]; then
            git clone --depth=1 -b android-9.0.0_r1 \
              https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchain/gcc64
            git clone --depth=1 -b android-9.0.0_r1 \
              https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 toolchain/gcc32
          fi

          echo "$(pwd)/toolchain/clang/bin" >> $GITHUB_PATH
          echo "$(pwd)/toolchain/gcc64/bin" >> $GITHUB_PATH
          echo "$(pwd)/toolchain/gcc32/bin" >> $GITHUB_PATH

      - name: 🔓 Patch KernelSU
        if: env.PATCH_KERNELSU != 'none'
        working-directory: kernel
        run: |
          if [ "$PATCH_KERNELSU" = "ksu-next" ]; then
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
          elif [ "$PATCH_KERNELSU" = "ksu-original" ]; then
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          fi

      - name: 🩺 Sanity check KernelSU
        working-directory: kernel
        run: |
          KSU_REF=$(grep -iE 'source[[:space:]]+["'"'"']?[^"'"'"']*kernelsu[^"'"'"']*/Kconfig' drivers/Kconfig 2>/dev/null || true)
          if [ -n "$KSU_REF" ]; then
            echo "KernelSU reference found in drivers/Kconfig: $KSU_REF"
            KSU_OK=0
            for d in drivers/kernelsu drivers/kernelsu-next KernelSU; do
              if [ -d "$d" ] && [ -n "$(ls -A "$d" 2>/dev/null)" ]; then
                KSU_OK=1
                echo "KernelSU driver folder found: $d"
                break
              fi
            done
            if [ "$KSU_OK" = "0" ]; then
              if [ "$PATCH_KERNELSU" = "none" ]; then
                echo "::warning::KernelSU reference exists but folder missing; removing references."
                sed -i '/kernelsu/Id' drivers/Kconfig
                sed -i '/kernelsu/Id' drivers/Makefile 2>/dev/null || true
              else
                echo "::error::PATCH_KERNELSU=${PATCH_KERNELSU} but KernelSU driver folder empty/missing."
                exit 1
              fi
            elif [ "$PATCH_KERNELSU" != "none" ]; then
              echo "::warning::Built-in KernelSU detected; PATCH_KERNELSU selected may cause duplication."
            fi
          fi

      - name: 🔨 Build kernel (with POLLY disabled)
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          COMMON_ARGS="-j$(nproc --all) O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip"

          if [ "$KERNEL_VERSION" != "4.19" ]; then
            COMMON_ARGS="$COMMON_ARGS CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- CLANG_TRIPLE=aarch64-linux-gnu-"
          else
            COMMON_ARGS="$COMMON_ARGS CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu-"
          fi

          # Generate defconfig
          make $COMMON_ARGS "$KERNEL_CONFIG"

          # 🔥 FIX: Disable LLVM_POLLY to avoid unknown -polly-* flags
          if [ -f scripts/config ] && [ -f out/.config ]; then
            ./scripts/config --file out/.config \
              -d COMPAT_VDSO \
              -d CC_STACKPROTECTOR_STRONG \
              -d CC_STACKPROTECTOR_AUTO \
              -d CC_STACKPROTECTOR_REGULAR \
              -e CC_STACKPROTECTOR_NONE \
              -d LLVM_POLLY   # <-- ini yang penting
            make $COMMON_ARGS olddefconfig
          fi

          # Build
          make $COMMON_ARGS 2>&1 | tee build.log

          # Find kernel image
          IMG=$(find out/arch/arm64/boot -type f -name "Image.gz-dtb" | head -n1)
          if [ -z "$IMG" ]; then
            IMG=$(find out/arch/arm64/boot -type f \( -name "Image.gz" -o -name "Image" -o -name "Image-dtb" \) | head -n1)
          fi
          if [ -z "$IMG" ]; then
            echo "Kernel image not found, build failed."
            exit 1
          fi
          echo "IMG_PATH=$(pwd)/$IMG" >> $GITHUB_ENV

          # dtb/dtbo
          DTB_IMG=$(find out/arch/arm64/boot -maxdepth 2 -type f -name "dtb.img" | head -n1)
          DTBO_IMG=$(find out -maxdepth 3 -type f -name "dtbo.img" | head -n1)
          [ -n "$DTB_IMG" ] && echo "DTB_IMG_PATH=$(pwd)/$DTB_IMG" >> $GITHUB_ENV
          [ -n "$DTBO_IMG" ] && echo "DTBO_IMG_PATH=$(pwd)/$DTBO_IMG" >> $GITHUB_ENV

      - name: 🏷️ Build filenames
        if: success()
        run: |
          DATE=$(date +%Y%m%d)
          case "$PATCH_KERNELSU" in
            ksu-next)     KSU_TAG="-KSU-NEXT" ;;
            ksu-original) KSU_TAG="-KSU" ;;
            *)            KSU_TAG="" ;;
          esac
          BASE_NAME="${KERNEL_NAME}-${CODENAME}-${DATE}${KSU_TAG}"
          echo "BASE_NAME=${BASE_NAME}" >> $GITHUB_ENV
          echo "RELEASE_TAG=build-${{ github.run_id }}" >> $GITHUB_ENV

      - name: 📱 Download KernelSU Manager APK
        if: success() && env.PATCH_KERNELSU != 'none'
        run: |
          mkdir -p manager_apk
          if [ "$PATCH_KERNELSU" = "ksu-original" ]; then
            APK_URL="https://github.com/tiann/KernelSU/releases/download/v0.6.6/KernelSU_v0.6.6_11184-release.apk"
            APK_VERSION="v0.6.6"
          elif [ "$PATCH_KERNELSU" = "ksu-next" ]; then
            API_RESPONSE=$(curl -s "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/releases/latest")
            APK_VERSION=$(echo "$API_RESPONSE" | jq -r '.tag_name')
            APK_URL=$(echo "$API_RESPONSE" | jq -r \
              '.assets[] | select(.name | test("^KernelSU_Next_v.*_[0-9]+-release\\.apk$")) | .browser_download_url' | head -n1)
          fi
          if [ -n "$APK_URL" ] && [ "$APK_URL" != "null" ]; then
            APK_FILE="manager_apk/$(basename "$APK_URL")"
            curl -LSs -o "$APK_FILE" "$APK_URL"
            echo "MANAGER_APK_PATH=$(pwd)/$APK_FILE" >> $GITHUB_ENV
            echo "MANAGER_APK_VERSION=${APK_VERSION}" >> $GITHUB_ENV
          else
            echo "::warning::Could not download Manager APK, skipping."
          fi

      - name: 🎁 Package with AnyKernel3
        if: success() && env.USE_ANYKERNEL3 == 'yes'
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/*.zip
          cp "$IMG_PATH" AnyKernel3/
          [ -n "$DTB_IMG_PATH" ] && cp "$DTB_IMG_PATH" AnyKernel3/
          [ -n "$DTBO_IMG_PATH" ] && cp "$DTBO_IMG_PATH" AnyKernel3/
          sed -i "s/device.name1=.*/device.name1=${CODENAME}/" AnyKernel3/anykernel.sh || true
          cd AnyKernel3
          zip -r9 "../${BASE_NAME}.zip" . -x ".git*" -x "*.zip"
          cd ..
          echo "ZIP_PATH=$(pwd)/${BASE_NAME}.zip" >> $GITHUB_ENV

      - name: 📄 Rename raw image
        if: success()
        run: |
          cp "$IMG_PATH" "./${BASE_NAME}-Image.gz-dtb"
          echo "RAW_IMG_PATH=$(pwd)/${BASE_NAME}-Image.gz-dtb" >> $GITHUB_ENV

      - name: 🚀 Publish to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "${{ env.BASE_NAME }}"
          body: |
            Kernel: ${{ env.KERNEL_NAME }}
            Kernel version: ${{ env.KERNEL_VERSION }}
            Codename: ${{ env.CODENAME }}
            KernelSU: ${{ env.PATCH_KERNELSU }}
            KernelSU Manager: ${{ env.MANAGER_APK_VERSION }}
            Commit: ${{ env.KERNEL_COMMIT }}
          files: |
            ${{ env.RAW_IMG_PATH }}
            ${{ env.ZIP_PATH }}
            ${{ env.MANAGER_APK_PATH }}
            ${{ env.DTB_IMG_PATH }}
            ${{ env.DTBO_IMG_PATH }}

      - name: ✅ Telegram success
        if: success() && env.BOT_TOKEN != '' && env.CHAT_ID != ''
        run: |
          KSU_LABEL="No"
          [ "$PATCH_KERNELSU" = "ksu-next" ] && KSU_LABEL="Yes (KSU-Next)"
          [ "$PATCH_KERNELSU" = "ksu-original" ] && KSU_LABEL="Yes (KSU Original)"

          SEND_FILE="$ZIP_PATH"
          [ "$USE_ANYKERNEL3" = "no" ] && SEND_FILE="$RAW_IMG_PATH"

          FILE_SIZE=$(du -h "$SEND_FILE" | cut -f1)
          FILE_SHA=$(sha256sum "$SEND_FILE" | cut -c1-12)
          ELAPSED=$(( $(date +%s) - START_EPOCH ))
          DURATION="$((ELAPSED / 60))m $((ELAPSED % 60))s"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${RELEASE_TAG}"

          MANAGER_LINE=""
          [ -n "$MANAGER_APK_VERSION" ] && MANAGER_LINE=$'\n📱 Manager: `'"${MANAGER_APK_VERSION}"'` (bundled in release)'

          MSG=$'✅ *Build Success*\nKernel: `'"${KERNEL_NAME}"'`\nDevice: `'"${CODENAME}"'`\nKernel version: `'"${KERNEL_VERSION}"'`\nKernelSU: `'"${KSU_LABEL}"'`'"${MANAGER_LINE}"$'\n\n⏱ Duration: `'"${DURATION}"'`\n📦 Size: `'"${FILE_SIZE}"'`\n🔗 SHA256: `'"${FILE_SHA}"'`\n📝 Commit: `'"${KERNEL_COMMIT}"'`'

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d parse_mode="Markdown" \
            --data-urlencode text="${MSG}" \
            --data-urlencode reply_markup="$(jq -n --arg run "$RUN_URL" --arg rel "$RELEASE_URL" \
              '{inline_keyboard: [[{text: "🔗 View Run", url: $run}, {text: "⬇️ Download", url: $rel}]]}')"

      - name: 📤 Telegram send file
        if: success() && env.BOT_TOKEN != '' && env.CHAT_ID != ''
        continue-on-error: true
        run: |
          SEND_FILE="$ZIP_PATH"
          [ "$USE_ANYKERNEL3" = "no" ] && SEND_FILE="$RAW_IMG_PATH"
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F chat_id="${CHAT_ID}" \
            -F document=@"${SEND_FILE}" \
            -F caption="${BASE_NAME}"

      - name: ❌ Telegram failure
        if: failure() && env.BOT_TOKEN != '' && env.CHAT_ID != ''
        run: |
          KSU_LABEL="No"
          [ "$PATCH_KERNELSU" = "ksu-next" ] && KSU_LABEL="Yes (KSU-Next)"
          [ "$PATCH_KERNELSU" = "ksu-original" ] && KSU_LABEL="Yes (KSU Original)"
          ELAPSED=$(( $(date +%s) - START_EPOCH ))
          DURATION="$((ELAPSED / 60))m $((ELAPSED % 60))s"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ERROR_LOG=$(tail -n 8 kernel/build.log 2>/dev/null | tr -d '`' || true)
          [ -z "$ERROR_LOG" ] && ERROR_LOG="(build.log not found, check run log)"
          MSG=$'❌ *Build Failed*\nKernel: `'"${KERNEL_NAME}"'`\nDevice: `'"${CODENAME}"'`\nKernel version: `'"${KERNEL_VERSION}"'`\nKernelSU: `'"${KSU_LABEL}"'`\n⏱ Duration: `'"${DURATION}"'`\n\n📄 *Last error:*\n\`\`\`\n'"${ERROR_LOG}"'\n\`\`\`'
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d parse_mode="Markdown" \
            --data-urlencode text="${MSG}" \
            --data-urlencode reply_markup="$(jq -n --arg url "$RUN_URL" \
              '{inline_keyboard: [[{text: "🔗 View Log", url: $url}]]}')"

      - name: 🧾 Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel/build.log
          if-no-files-found: ignore
