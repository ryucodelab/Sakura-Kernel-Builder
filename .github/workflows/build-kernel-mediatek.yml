name: Kernel Builder (mediatek)

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: "Kernel source repo"
        required: true
        type: string

      KERNEL_BRANCH:
        description: "Kernel branch"
        required: true
        type: string

      KERNEL_CONFIG:
        description: "Defconfig"
        required: true
        type: string

      KERNEL_NAME:
        description: "Kernel name"
        required: false
        default: "ZeroTwo"

      CODENAME:
        description: "Device codename"
        required: true
        type: string

      KERNELSU:
        description: "KernelSU"
        required: false
        default: "none"

      BOT_TOKEN:
        description: "Telegram Bot Token"
        required: false

      CHAT_ID:
        description: "Telegram Chat ID"
        required: false


permissions:
  contents: write


jobs:
  build:

    runs-on: ubuntu-22.04

    env:
      KERNEL_SOURCE: ${{ inputs.KERNEL_SOURCE }}
      KERNEL_BRANCH: ${{ inputs.KERNEL_BRANCH }}
      KERNEL_CONFIG: ${{ inputs.KERNEL_CONFIG }}
      KERNEL_NAME: ${{ inputs.KERNEL_NAME }}
      CODENAME: ${{ inputs.CODENAME }}

      BOT_TOKEN: ${{ inputs.BOT_TOKEN }}
      CHAT_ID: ${{ inputs.CHAT_ID }}

      LLVM: 1
      LLVM_IAS: 1


    steps:

    - name: Start timer
      run: |
        echo "START_TIME=$(date +%s)" >> $GITHUB_ENV


    - name: Install dependencies
      run: |
        sudo apt update

        sudo apt install -y \
        bc \
        bison \
        flex \
        build-essential \
        libssl-dev \
        libelf-dev \
        libncurses-dev \
        dwarves \
        ccache \
        git \
        curl \
        wget \
        zip \
        unzip \
        python3


    - name: Clone kernel
      run: |

        git clone \
        --depth=1 \
        -b "$KERNEL_BRANCH" \
        "$KERNEL_SOURCE" kernel


    - name: Setup Clang 17

      run: |

        mkdir toolchain

        git clone \
        --depth=1 \
        -b 17.0.2 \
        https://github.com/ZyCromerZ/Clang \
        toolchain/clang


        echo "$(pwd)/toolchain/clang/bin" >> $GITHUB_PATH


    - name: Telegram Build Start

      if: env.BOT_TOKEN != ''

      run: |

        MSG="<b>🔨 Kernel Build Started</b>

<b>Kernel:</b> <code>${KERNEL_NAME}</code>
<b>Device:</b> <code>${CODENAME}</code>
<b>Compiler:</b> <code>Clang 17</code>
<b>LLVM:</b> Enabled"

        curl -s \
        -X POST \
        "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
        -d chat_id="${CHAT_ID}" \
        -d parse_mode="HTML" \
        --data-urlencode text="$MSG"



    - name: Build Kernel

      working-directory: kernel

      run: |

        export ARCH=arm64

        make \
        O=out \
        ARCH=arm64 \
        LLVM=1 \
        LLVM_IAS=1 \
        CC=clang \
        LD=ld.lld \
        AR=llvm-ar \
        NM=llvm-nm \
        OBJCOPY=llvm-objcopy \
        OBJDUMP=llvm-objdump \
        STRIP=llvm-strip \
        "$KERNEL_CONFIG"


        ./scripts/config \
        --file out/.config \
        -e CC_STACKPROTECTOR_STRONG \
        -d CC_STACKPROTECTOR_AUTO \
        -d POLLY_CLANG


        make \
        O=out \
        ARCH=arm64 \
        LLVM=1 \
        LLVM_IAS=1 \
        CC=clang \
        LD=ld.lld \
        AR=llvm-ar \
        -j$(nproc)



    - name: Package Kernel

      run: |

        mkdir release

        cp kernel/out/arch/arm64/boot/Image \
        release/${KERNEL_NAME}-${CODENAME}.img


    - name: Upload Release

      uses: softprops/action-gh-release@v2

      with:

        tag_name: build-${{ github.run_id }}

        files: |
          release/*
